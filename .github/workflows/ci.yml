---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  formula:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            asset: stay-v0.0.99-aarch64-apple-darwin.tar.gz
            checksum: >-
              20b6d97de53e0d0a7881d58f78987ada39c3984bd4643663bebb4137b1c93f26
          - target: macos-x86_64
            runner: macos-15-intel
            asset: stay-v0.0.99-x86_64-apple-darwin.tar.gz
            checksum: >-
              7fcbf5e2a33d6a8e37756a4c9e770cc2d4d53347fa914ab0b7bbdcbcc5642b32
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            asset: stay-v0.0.99-aarch64-unknown-linux-gnu.tar.gz
            checksum: >-
              4bdb5e5a796f3c23c838ed0f29799e5bab29362fd55e67cf4195a43eb07d3793
          - target: linux-x86_64
            runner: ubuntu-24.04
            asset: stay-v0.0.99-x86_64-unknown-linux-gnu.tar.gz
            checksum: >-
              1335128395d5bad4f14af641021a1f6f4bce6fbc825c05ca8d71b225aafec664
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out tap
        uses: >-
          actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Homebrew on Linux
        if: runner.os == 'Linux'
        uses: >-
          Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Install Homebrew formula
        env:
          ASSET: ${{ matrix.asset }}
          CHECKSUM: ${{ matrix.checksum }}
          RELEASE_REPOSITORY: nevdelap/stay
        run: |
          set -euo pipefail
          release_url="https://github.com/$RELEASE_REPOSITORY/releases/download/v0.0.99"
          formula_source_path="$RUNNER_TEMP/stay-formula.rb"
          cp Formula/stay.rb "$formula_source_path"
          # GitHub-hosted runners may have third-party taps installed whose
          # formulas are invalid on the current platform. Keep this test
          # isolated to official Homebrew taps and the tap under test. The
          # runner is disposable, so also remove any preinstalled formulae
          # before untapping an unrelated repository.
          while IFS= read -r tap; do
            case "$tap" in
              homebrew/*|nevdelap/stay) ;;
              *) brew untap --force "$tap" ;;
            esac
          done < <(brew tap)
          brew tap nevdelap/stay
          brew update
          tap_path="$(brew --repository nevdelap/stay)"
          formula_destination_path="$tap_path/Formula/stay.rb"
          if [[ ! -e "$formula_destination_path" ]] ||
             ! cmp "$formula_source_path" "$formula_destination_path" \
               >/dev/null 2>&1; then
            mkdir -p "$tap_path/Formula"
            cp "$formula_source_path" "$formula_destination_path"
          fi
          test -f "$formula_destination_path"
          cmp "$formula_source_path" "$formula_destination_path"
          brew audit --strict --new --formula nevdelap/stay/stay
          brew style --formula nevdelap/stay/stay
          brew fetch --force --retry nevdelap/stay/stay
          asset_path="$(brew --cache nevdelap/stay/stay)"
          test -f "$asset_path"
          release_checksum="$(
            curl --fail --silent --show-error --location \
              "$release_url/SHA256SUMS" |
              awk -v asset="$ASSET" '$2 == asset { print $1 }'
          )"
          test "$release_checksum" = "$CHECKSUM"
          case "$(uname -s)" in
            Darwin) checksum_command=(shasum -a 256 -c -) ;;
            Linux) checksum_command=(sha256sum --check) ;;
            *) echo "unsupported host" >&2; exit 1 ;;
          esac
          printf '%s  %s\n' "$release_checksum" "$asset_path" |
            "${checksum_command[@]}"
          brew install nevdelap/stay/stay
          brew test nevdelap/stay/stay
