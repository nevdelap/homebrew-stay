---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  formula:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            asset: stay-v0.0.87-aarch64-apple-darwin.tar.gz
            checksum: >-
              4de3968d38f091fd36a636b46e8dfb9216a4753724df683e4cf2c9a572f91715
          - target: macos-x86_64
            runner: macos-15-intel
            asset: stay-v0.0.87-x86_64-apple-darwin.tar.gz
            checksum: >-
              002301ce222d385a29e352cdba5f176f379c142406be7947796072e382cb318e
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            asset: stay-v0.0.87-aarch64-unknown-linux-gnu.tar.gz
            checksum: >-
              c5fcee3aa5fe828c4f558abf7b29c75ccd97355e2d6f9c59cbc3be25c6dd35fb
          - target: linux-x86_64
            runner: ubuntu-24.04
            asset: stay-v0.0.87-x86_64-unknown-linux-gnu.tar.gz
            checksum: >-
              ae366373199f3f37c485784ce5f2b07ba2c773c8e6a689c655522ebc1befafd8
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out tap
        uses: >-
          actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Homebrew on Linux
        if: runner.os == 'Linux'
        uses: >-
          Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Install Homebrew formula
        env:
          ASSET: ${{ matrix.asset }}
          CHECKSUM: ${{ matrix.checksum }}
          RELEASE_REPOSITORY: nevdelap/stay
        run: |
          set -euo pipefail
          release_url="https://github.com/$RELEASE_REPOSITORY/releases/download/v0.0.87"
          formula_source_path="$RUNNER_TEMP/stay-formula.rb"
          cp Formula/stay.rb "$formula_source_path"
          brew tap nevdelap/stay
          brew update
          tap_path="$(brew --repository nevdelap/stay)"
          formula_destination_path="$tap_path/Formula/stay.rb"
          if [[ ! -e "$formula_destination_path" ]] ||
             ! cmp "$formula_source_path" "$formula_destination_path" \
               >/dev/null 2>&1; then
            mkdir -p "$tap_path/Formula"
            cp "$formula_source_path" "$formula_destination_path"
          fi
          test -f "$formula_destination_path"
          cmp "$formula_source_path" "$formula_destination_path"
          brew audit --strict --new --formula nevdelap/stay/stay
          brew style --formula nevdelap/stay/stay
          brew fetch --force --retry nevdelap/stay/stay
          asset_path="$(brew --cache nevdelap/stay/stay)"
          test -f "$asset_path"
          release_checksum="$(
            curl --fail --silent --show-error --location \
              "$release_url/SHA256SUMS" |
              awk -v asset="$ASSET" '$2 == asset { print $1 }'
          )"
          test "$release_checksum" = "$CHECKSUM"
          case "$(uname -s)" in
            Darwin) checksum_command=(shasum -a 256 -c -) ;;
            Linux) checksum_command=(sha256sum --check) ;;
            *) echo "unsupported host" >&2; exit 1 ;;
          esac
          printf '%s  %s\n' "$release_checksum" "$asset_path" |
            "${checksum_command[@]}"
          brew install nevdelap/stay/stay
          brew test nevdelap/stay/stay
