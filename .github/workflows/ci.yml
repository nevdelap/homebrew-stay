---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  formula:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            asset: stay-v0.0.88-aarch64-apple-darwin.tar.gz
            checksum: >-
              6a0a215097a49a634e9620c33553132b0f3ad78bdcd007c30d6b64921ace6eab
          - target: macos-x86_64
            runner: macos-15-intel
            asset: stay-v0.0.88-x86_64-apple-darwin.tar.gz
            checksum: >-
              9583e27ae12228f83db15fa72f319b3faf62639e64b56e9aa389bec58fec18f8
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            asset: stay-v0.0.88-aarch64-unknown-linux-gnu.tar.gz
            checksum: >-
              b41d5260b60163dad245466a49d44d47f0b19b3a4725079bd17bc7e6b5921022
          - target: linux-x86_64
            runner: ubuntu-24.04
            asset: stay-v0.0.88-x86_64-unknown-linux-gnu.tar.gz
            checksum: >-
              5560913eefda4dccb7b357f34e3fe41160cc6d27a149a75985f502e52c91a022
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out tap
        uses: >-
          actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Homebrew on Linux
        if: runner.os == 'Linux'
        uses: >-
          Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Install Homebrew formula
        env:
          ASSET: ${{ matrix.asset }}
          CHECKSUM: ${{ matrix.checksum }}
          RELEASE_REPOSITORY: nevdelap/stay
        run: |
          set -euo pipefail
          release_url="https://github.com/$RELEASE_REPOSITORY/releases/download/v0.0.88"
          formula_source_path="$RUNNER_TEMP/stay-formula.rb"
          cp Formula/stay.rb "$formula_source_path"
          brew tap nevdelap/stay
          brew update
          tap_path="$(brew --repository nevdelap/stay)"
          formula_destination_path="$tap_path/Formula/stay.rb"
          if [[ ! -e "$formula_destination_path" ]] ||
             ! cmp "$formula_source_path" "$formula_destination_path" \
               >/dev/null 2>&1; then
            mkdir -p "$tap_path/Formula"
            cp "$formula_source_path" "$formula_destination_path"
          fi
          test -f "$formula_destination_path"
          cmp "$formula_source_path" "$formula_destination_path"
          brew audit --strict --new --formula nevdelap/stay/stay
          brew style --formula nevdelap/stay/stay
          brew fetch --force --retry nevdelap/stay/stay
          asset_path="$(brew --cache nevdelap/stay/stay)"
          test -f "$asset_path"
          release_checksum="$(
            curl --fail --silent --show-error --location \
              "$release_url/SHA256SUMS" |
              awk -v asset="$ASSET" '$2 == asset { print $1 }'
          )"
          test "$release_checksum" = "$CHECKSUM"
          case "$(uname -s)" in
            Darwin) checksum_command=(shasum -a 256 -c -) ;;
            Linux) checksum_command=(sha256sum --check) ;;
            *) echo "unsupported host" >&2; exit 1 ;;
          esac
          printf '%s  %s\n' "$release_checksum" "$asset_path" |
            "${checksum_command[@]}"
          brew install nevdelap/stay/stay
          brew test nevdelap/stay/stay
