---
name: CI
"on":
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  formula:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-14
            asset: stay-v0.0.90-aarch64-apple-darwin.tar.gz
            checksum: >-
              0767ea526cd485fb0ec4af90e63e8dbd52ecdc0561f08559c076c6a18df1572f
          - target: macos-x86_64
            runner: macos-15-intel
            asset: stay-v0.0.90-x86_64-apple-darwin.tar.gz
            checksum: >-
              5dffd22949c962fcd81394caefefe2d86d84310d6665de1ce9d40b61d619b40e
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            asset: stay-v0.0.90-aarch64-unknown-linux-gnu.tar.gz
            checksum: >-
              8d3f94b2b945121beff80af9049954ffa00ef94dc17602a81912c3683a148780
          - target: linux-x86_64
            runner: ubuntu-24.04
            asset: stay-v0.0.90-x86_64-unknown-linux-gnu.tar.gz
            checksum: >-
              a26ea47cc0f80b589e13c4c53f9f205baab33327b450243e8a8171648aa87bf2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out tap
        uses: >-
          actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Homebrew on Linux
        if: runner.os == 'Linux'
        uses: >-
          Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Install Homebrew formula
        env:
          ASSET: ${{ matrix.asset }}
          CHECKSUM: ${{ matrix.checksum }}
          RELEASE_REPOSITORY: nevdelap/stay
        run: |
          set -euo pipefail
          release_url="https://github.com/$RELEASE_REPOSITORY/releases/download/v0.0.90"
          formula_source_path="$RUNNER_TEMP/stay-formula.rb"
          cp Formula/stay.rb "$formula_source_path"
          brew tap nevdelap/stay
          brew update
          tap_path="$(brew --repository nevdelap/stay)"
          formula_destination_path="$tap_path/Formula/stay.rb"
          if [[ ! -e "$formula_destination_path" ]] ||
             ! cmp "$formula_source_path" "$formula_destination_path" \
               >/dev/null 2>&1; then
            mkdir -p "$tap_path/Formula"
            cp "$formula_source_path" "$formula_destination_path"
          fi
          test -f "$formula_destination_path"
          cmp "$formula_source_path" "$formula_destination_path"
          brew audit --strict --new --formula nevdelap/stay/stay
          brew style --formula nevdelap/stay/stay
          brew fetch --force --retry nevdelap/stay/stay
          asset_path="$(brew --cache nevdelap/stay/stay)"
          test -f "$asset_path"
          release_checksum="$(
            curl --fail --silent --show-error --location \
              "$release_url/SHA256SUMS" |
              awk -v asset="$ASSET" '$2 == asset { print $1 }'
          )"
          test "$release_checksum" = "$CHECKSUM"
          case "$(uname -s)" in
            Darwin) checksum_command=(shasum -a 256 -c -) ;;
            Linux) checksum_command=(sha256sum --check) ;;
            *) echo "unsupported host" >&2; exit 1 ;;
          esac
          printf '%s  %s\n' "$release_checksum" "$asset_path" |
            "${checksum_command[@]}"
          brew install nevdelap/stay/stay
          brew test nevdelap/stay/stay
